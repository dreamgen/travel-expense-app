<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #1f2937; padding: 12px; background: #f9fafb; }
    .header { text-align: center; padding: 12px 0; border-bottom: 1px solid #e5e7eb; margin-bottom: 12px; }
    .header h2 { font-size: 16px; color: #4338ca; }
    .header p { font-size: 11px; color: #6b7280; margin-top: 4px; }

    .trip-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: box-shadow 0.15s; }
    .trip-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .trip-card.selected { border-color: #4338ca; box-shadow: 0 0 0 2px rgba(67,56,202,0.2); }
    .trip-code { font-weight: 600; color: #4338ca; font-size: 13px; }
    .trip-meta { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .trip-badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }

    .badge { display: inline-block; padding: 1px 6px; border-radius: 9999px; font-size: 10px; font-weight: 500; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #d1fae5; color: #065f46; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    .badge-needs_revision { background: #fed7aa; color: #c2410c; }
    .badge-modified_pending { background: #fde68a; color: #78350f; border: 1px dashed #d97706; }
    .badge-locked { background: #e5e7eb; color: #374151; }
    .badge-open { background: #dbeafe; color: #1e40af; }
    .badge-submitted { background: #e0e7ff; color: #3730a3; }
    .badge-closed { background: #e5e7eb; color: #374151; }

    .section-title { font-size: 12px; font-weight: 600; color: #374151; margin: 12px 0 6px; }
    .expense-item { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; margin-bottom: 6px; }
    .expense-header { display: flex; justify-content: space-between; align-items: center; }
    .expense-category { font-weight: 500; font-size: 12px; }
    .expense-amount { font-weight: 600; color: #4338ca; font-size: 12px; }
    .expense-desc { font-size: 11px; color: #6b7280; margin-top: 2px; }
    .expense-submitter { font-size: 10px; color: #9ca3af; }

    .btn-group { display: flex; gap: 4px; margin-top: 6px; }
    .btn { padding: 4px 8px; border: none; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: 500; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-approve { background: #10b981; color: #fff; }
    .btn-reject { background: #ef4444; color: #fff; }
    .btn-revision { background: #f59e0b; color: #fff; }
    .btn-back { background: #e5e7eb; color: #374151; }

    .actions-bar { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }

    .loading { text-align: center; padding: 20px; color: #6b7280; }
    .empty { text-align: center; padding: 20px; color: #9ca3af; font-size: 12px; }

    .note-input { width: 100%; padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 11px; margin-top: 4px; }

    .review-note-display { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 4px; padding: 4px 6px; margin-top: 4px; font-size: 11px; color: #9a3412; }
    .review-note-display .note-date { font-size: 10px; color: #c2410c; margin-bottom: 2px; }
    .photo-link { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: #4338ca; cursor: pointer; margin-top: 4px; text-decoration: none; }
    .photo-link:hover { text-decoration: underline; }
    .photo-thumb { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; cursor: pointer; border: 1px solid #e5e7eb; margin-top: 4px; }

    /* Search & Filter bar */
    .search-bar { margin-bottom: 8px; }
    .search-bar input { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 12px; outline: none; }
    .search-bar input:focus { border-color: #4338ca; box-shadow: 0 0 0 2px rgba(67,56,202,0.15); }
    .filter-bar { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 9999px; font-size: 10px; cursor: pointer; background: #fff; color: #374151; transition: all 0.15s; }
    .filter-btn:hover { border-color: #4338ca; color: #4338ca; }
    .filter-btn.active { background: #4338ca; color: #fff; border-color: #4338ca; }
    .filter-select { padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 11px; background: #fff; flex: 1; min-width: 80px; }
    .filter-select:focus { border-color: #4338ca; outline: none; }
    .trip-count { font-size: 10px; color: #9ca3af; margin-bottom: 6px; }

    /* Not-submitted info banner */
    .info-banner { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; font-size: 11px; color: #1e40af; }

    /* Sort bar */
    .sort-bar { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
    .sort-bar span { font-size: 10px; color: #9ca3af; }
    .sort-btn { padding: 2px 6px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 10px; cursor: pointer; background: #fff; color: #374151; transition: all 0.15s; }
    .sort-btn:hover { border-color: #4338ca; color: #4338ca; }
    .sort-btn.active { background: #4338ca; color: #fff; border-color: #4338ca; }

    /* Lightbox overlay */
    .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 95%; max-height: 80%; border-radius: 8px; transition: transform 0.2s ease; cursor: grab; user-select: none; -webkit-user-select: none; }
    .lightbox img:active { cursor: grabbing; }
    .lightbox-close { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.2); border: none; color: #fff; width: 28px; height: 28px; border-radius: 14px; font-size: 16px; cursor: pointer; z-index: 10001; }
    .lightbox-controls { position: absolute; bottom: 16px; display: flex; gap: 8px; z-index: 10001; }
    .lightbox-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 36px; height: 36px; border-radius: 18px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
    .lightbox-btn:hover { background: rgba(255,255,255,0.4); }
    .lightbox-hint { position: absolute; bottom: 58px; font-size: 10px; color: rgba(255,255,255,0.5); z-index: 10001; text-align: center; max-width: 90%; }
    /* V2.2: 左右導航按鈕 */
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.15); border: none; color: #fff; width: 40px; height: 60px; font-size: 28px; cursor: pointer; z-index: 10001; transition: background 0.15s; display: flex; align-items: center; justify-content: center; }
    .lightbox-nav:hover { background: rgba(255,255,255,0.35); }
    .lightbox-nav-left { left: 8px; border-radius: 4px; }
    .lightbox-nav-right { right: 8px; border-radius: 4px; }

    #tripList, #tripDetail { display: none; }
    .view-active { display: block !important; }

    /* 彈出視窗模式隱藏切換按鈕 */
    html.popup-mode .popup-btn { display: none !important; }

    /* 彈出視窗模式：寬螢幕時使用 Grid 佈局 */
    html.popup-mode body { max-width: 1200px; margin: 0 auto; padding: 16px 24px; }
    html.popup-mode .header h2 { font-size: 20px; }
    html.popup-mode .header p { font-size: 13px; }

    /* 費用列表 Grid 佈局（寬螢幕時） */
    .expense-grid { display: block; }

    @media (min-width: 600px) {
      html.popup-mode .expense-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
      }
      html.popup-mode .expense-item {
        margin-bottom: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      html.popup-mode .expense-item .photo-container {
        max-width: 100%;
        max-height: 180px;
        overflow: hidden;
        border-radius: 6px;
        margin-top: 8px;
      }
      html.popup-mode .expense-item .photo-container img {
        width: 100%;
        height: auto;
        max-height: 180px;
        object-fit: contain;
      }
      html.popup-mode .section-title { font-size: 14px; margin: 16px 0 10px; }
      html.popup-mode .sort-bar { margin-bottom: 12px; }
      html.popup-mode .trip-card { padding: 14px; }
      html.popup-mode .trip-code { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>費用審核系統</h2>
    <p>審核人員專用 Sidebar</p>
    <button class="btn popup-btn" style="margin-top: 8px; background: #4338ca; color: #fff;" onclick="openAsWindow()">
      ↗ 彈出視窗模式
    </button>
  </div>

  <!-- Trip List View -->
  <div id="tripList">
    <div class="search-bar">
      <input type="text" id="tripSearchInput" placeholder="搜尋 Trip Code、地點、團長..." oninput="filterTripList()">
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all" onclick="setTripFilter('all', this)">全部</button>
      <button class="filter-btn" data-filter="Submitted" onclick="setTripFilter('Submitted', this)">待審核</button>
      <button class="filter-btn" data-filter="Open" onclick="setTripFilter('Open', this)">進行中</button>
      <button class="filter-btn" data-filter="Closed" onclick="setTripFilter('Closed', this)">已結案</button>
    </div>
    <div class="trip-count" id="tripCount"></div>
    <div id="tripListContainer"><div class="loading">載入中...</div></div>
  </div>

  <!-- Trip Detail View -->
  <div id="tripDetail">
    <div class="actions-bar">
      <button class="btn btn-back" onclick="showTripList()">← 返回列表</button>
    </div>
    <div id="tripDetailInfo"></div>
    <div id="notSubmittedBanner"></div>
    <div class="section-title">費用明細</div>
    <!-- V2.2: 篩選器區域 -->
    <div class="filter-section" id="expenseFilterSection" style="margin-bottom: 8px;">
      <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px;">
        <select id="expenseStatusFilter" onchange="filterExpenses()" class="filter-select">
          <option value="all">全部狀態</option>
          <option value="pending" selected>待審核</option>
          <option value="approved">已通過</option>
          <option value="rejected">已退回</option>
          <option value="needs_revision">須補件</option>
          <option value="modified_pending">已修改待審</option>
        </select>
        <select id="expensePersonFilter" onchange="filterExpenses()" class="filter-select">
          <option value="all">全部人員</option>
        </select>
        <select id="expenseCategoryFilter" onchange="filterExpenses()" class="filter-select">
          <option value="all">全部類別</option>
        </select>
      </div>
      <button onclick="toggleAllPhotos()" class="btn btn-back" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 4px;">
        <i class="fa-solid fa-images" style="font-family: 'Font Awesome 6 Free'; font-weight: 900;"></i> 顯示全部照片
      </button>
    </div>
    <div class="sort-bar" id="sortBar" style="display:none;">
      <span>排序：</span>
      <button class="sort-btn active" id="sortDate" onclick="sortExpenses('date')">日期 ↓</button>
      <button class="sort-btn" id="sortAmount" onclick="sortExpenses('amount')">金額</button>
      <button class="sort-btn" id="sortName" onclick="sortExpenses('name')">提交人</button>
    </div>
    <div id="expenseListContainer" class="expense-grid"><div class="loading">載入中...</div></div>
  </div>

  <!-- Lightbox for photo preview (V2.2: 支援多照片瀏覽) -->
  <div id="sidebarLightbox" class="lightbox" onclick="closeLightbox(event)">
    <button class="lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <!-- V2.2: 左右導航按鈕 -->
    <button class="lightbox-nav lightbox-nav-left" onclick="event.stopPropagation(); prevPhoto();" title="上一張">‹</button>
    <img id="lightboxImg" src="" draggable="false">
    <button class="lightbox-nav lightbox-nav-right" onclick="event.stopPropagation(); nextPhoto();" title="下一張">›</button>
    <div class="lightbox-hint">滾輪縮放 · 拖曳平移 · 雙擊重置</div>
    <div class="lightbox-controls">
      <button class="lightbox-btn" onclick="lbZoom(1)" title="放大">+</button>
      <button class="lightbox-btn" onclick="lbZoom(-1)" title="縮小">−</button>
      <button class="lightbox-btn" onclick="lbRotate()" title="旋轉">↻</button>
      <button class="lightbox-btn" onclick="lbReset()" title="重置">⟲</button>
    </div>
  </div>

  <script>
    var currentTrips = [];
    var currentTripCode = null;
    var currentTripData = null;
    var currentExpenses = [];
    var currentTripFilter = 'all';

    // Sort state
    var currentSortField = 'date';
    var currentSortDir = 'desc';

    // Lightbox state
    var lbScale = 1;
    var lbRotation = 0;
    var lbTranslateX = 0;
    var lbTranslateY = 0;
    var lbDragging = false;
    var lbStartX = 0;
    var lbStartY = 0;

    // === Init ===
    function init() {
      // 檢測並更新彈出視窗模式
      // Sidebar 寬度固定為 300-400px，彈出視窗通常 > 500px
      updatePopupMode();
      window.addEventListener('resize', updatePopupMode);

      document.getElementById('tripList').classList.add('view-active');
      loadTrips();
    }

    function updatePopupMode() {
      // 視窗寬度 > 500px 時視為彈出視窗模式
      var isPopupMode = window.innerWidth > 500;
      if (isPopupMode) {
        document.documentElement.classList.add('popup-mode');
      } else {
        document.documentElement.classList.remove('popup-mode');
      }
    }

    // === 彈出視窗模式 ===
    function openAsWindow() {
      // 獲取 GAS Web App URL 並以彈出視窗開啟
      google.script.run
        .withSuccessHandler(function(url) {
          if (url) {
            // 構建審核頁面 URL
            var reviewUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + 'mode=review';
            window.open(reviewUrl, 'ReviewWindow', 'width=600,height=800,scrollbars=yes,resizable=yes');
          } else {
            alert('無法取得 Web App URL。\n\n請確認 Web App 已部署。');
          }
        })
        .withFailureHandler(function(err) {
          alert('無法取得 Web App URL: ' + err.message + '\n\n請確認 Web App 已部署。');
        })
        .getWebAppUrl();
    }

    // === Trip List ===
    function loadTrips() {
      google.script.run
        .withSuccessHandler(function(trips) {
          currentTrips = trips;
          filterTripList();
        })
        .withFailureHandler(function(err) {
          document.getElementById('tripListContainer').innerHTML = '<div class="empty">載入失敗: ' + err.message + '</div>';
        })
        .sidebarGetTrips();
    }

    function setTripFilter(filter, btn) {
      currentTripFilter = filter;
      // Update active button
      var btns = document.querySelectorAll('.filter-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
      if (btn) btn.classList.add('active');
      filterTripList();
    }

    function filterTripList() {
      var searchText = (document.getElementById('tripSearchInput').value || '').toLowerCase().trim();
      var filtered = [];
      for (var i = 0; i < currentTrips.length; i++) {
        var t = currentTrips[i];
        // 篩選 tripStatus
        if (currentTripFilter !== 'all' && (t.tripStatus || 'Open') !== currentTripFilter) continue;
        // 搜尋關鍵字
        if (searchText) {
          var searchTarget = ((t.tripCode || '') + ' ' + (t.location || '') + ' ' + (t.submittedBy || '') + ' ' + (t.leaderName || '')).toLowerCase();
          if (searchTarget.indexOf(searchText) === -1) continue;
        }
        filtered.push(t);
      }
      document.getElementById('tripCount').textContent = '顯示 ' + filtered.length + ' / ' + currentTrips.length + ' 筆';
      renderTripList(filtered);
    }

    function renderTripList(trips) {
      var container = document.getElementById('tripListContainer');
      if (!trips || trips.length === 0) {
        container.innerHTML = '<div class="empty">沒有符合條件的旅遊記錄</div>';
        return;
      }

      var html = '';
      for (var i = 0; i < trips.length; i++) {
        var t = trips[i];
        html += '<div class="trip-card" onclick="selectTrip(\'' + t.tripCode + '\')">';
        html += '<div class="trip-code">' + escHtml(t.tripCode) + '</div>';
        html += '<div class="trip-meta">' + escHtml(t.location || '未設定地點') + ' · ' + escHtml(t.submittedBy || '') + '</div>';
        html += '<div class="trip-badges">';
        html += '<span class="badge badge-' + t.status + '">' + statusLabel(t.status) + '</span>';
        html += '<span class="badge badge-' + (t.tripStatus || 'open').toLowerCase() + '">' + tripStatusLabel(t.tripStatus) + '</span>';
        if (t.isLocked) html += '<span class="badge badge-locked">🔒 已鎖定</span>';
        html += '</div></div>';
      }
      container.innerHTML = html;
    }

    // === Trip Detail ===
    function selectTrip(tripCode) {
      currentTripCode = tripCode;
      currentTripData = null;
      for (var i = 0; i < currentTrips.length; i++) {
        if (currentTrips[i].tripCode === tripCode) { currentTripData = currentTrips[i]; break; }
      }

      document.getElementById('tripList').classList.remove('view-active');
      document.getElementById('tripDetail').classList.add('view-active');

      // Update info
      updateDetailInfo();
      loadExpenses(tripCode);
    }

    function isSubmitted() {
      return currentTripData && (currentTripData.tripStatus === 'Submitted' || currentTripData.tripStatus === 'Closed');
    }

    function updateDetailInfo() {
      var t = currentTripData;
      if (!t) return;

      var html = '<div class="trip-card selected">';
      html += '<div class="trip-code">' + escHtml(t.tripCode) + '</div>';
      html += '<div class="trip-meta">' + escHtml(t.location || '') + ' · ' + escHtml(t.submittedBy || '') + '</div>';
      html += '<div class="trip-badges">';
      html += '<span class="badge badge-' + t.status + '">' + statusLabel(t.status) + '</span>';
      html += '<span class="badge badge-' + (t.tripStatus || 'open').toLowerCase() + '">' + tripStatusLabel(t.tripStatus) + '</span>';
      if (t.isLocked) html += '<span class="badge badge-locked">🔒 已鎖定</span>';
      html += '</div></div>';
      document.getElementById('tripDetailInfo').innerHTML = html;

      // 顯示未送審提示
      var banner = document.getElementById('notSubmittedBanner');
      if (!isSubmitted()) {
        banner.innerHTML = '<div class="info-banner">ℹ️ 此案件尚未由團長送出審核，目前僅供查看，無法進行審核操作。</div>';
      } else {
        banner.innerHTML = '';
      }
    }

    function loadExpenses(tripCode) {
      document.getElementById('expenseListContainer').innerHTML = '<div class="loading">載入中...</div>';
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            currentExpenses = result.expenses;
            // Show sort bar if there are expenses
            var sortBar = document.getElementById('sortBar');
            if (sortBar) sortBar.style.display = currentExpenses.length > 0 ? 'flex' : 'none';
            // V2.2: 填入篩選器選項
            populateFilterOptions();
            renderSortedExpenses();
          } else {
            document.getElementById('expenseListContainer').innerHTML = '<div class="empty">' + result.error + '</div>';
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('expenseListContainer').innerHTML = '<div class="empty">載入失敗</div>';
        })
        .sidebarGetTripExpenses(tripCode);
    }

    function sortExpenses(field) {
      if (currentSortField === field) {
        currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSortField = field;
        currentSortDir = field === 'amount' ? 'desc' : 'asc';
      }
      updateSortButtons();
      renderSortedExpenses();
    }

    function updateSortButtons() {
      var fields = ['date', 'amount', 'name'];
      var labels = { date: '日期', amount: '金額', name: '提交人' };
      for (var i = 0; i < fields.length; i++) {
        var btn = document.getElementById('sort' + fields[i].charAt(0).toUpperCase() + fields[i].slice(1));
        if (!btn) continue;
        if (fields[i] === currentSortField) {
          btn.className = 'sort-btn active';
          btn.textContent = labels[fields[i]] + ' ' + (currentSortDir === 'asc' ? '↑' : '↓');
        } else {
          btn.className = 'sort-btn';
          btn.textContent = labels[fields[i]];
        }
      }
    }

    // V2.2: 篩選費用
    function filterExpenses() {
      renderSortedExpenses();
    }

    // V2.2: 填入篩選器選項
    function populateFilterOptions() {
      // 人員選項
      var persons = {};
      for (var i = 0; i < currentExpenses.length; i++) {
        var p = currentExpenses[i].employeeName || '未知';
        persons[p] = true;
      }
      var personFilter = document.getElementById('expensePersonFilter');
      if (personFilter) {
        var personHtml = '<option value="all">全部人員</option>';
        for (var name in persons) {
          personHtml += '<option value="' + escAttr(name) + '">' + escHtml(name) + '</option>';
        }
        personFilter.innerHTML = personHtml;
      }

      // 類別選項
      var categories = {};
      for (var i = 0; i < currentExpenses.length; i++) {
        var c = currentExpenses[i].category || '其他';
        categories[c] = true;
      }
      var catFilter = document.getElementById('expenseCategoryFilter');
      if (catFilter) {
        var catHtml = '<option value="all">全部類別</option>';
        for (var cat in categories) {
          catHtml += '<option value="' + escAttr(cat) + '">' + escHtml(cat) + '</option>';
        }
        catFilter.innerHTML = catHtml;
      }
    }

    // V2.2: 取得已篩選的費用
    function getFilteredExpenses() {
      var filtered = currentExpenses.slice();

      // 狀態篩選
      var statusFilter = document.getElementById('expenseStatusFilter');
      var statusVal = statusFilter ? statusFilter.value : 'pending';
      if (statusVal !== 'all') {
        filtered = filtered.filter(function(e) {
          return (e.expenseStatus || 'pending') === statusVal;
        });
      }

      // 人員篩選
      var personFilter = document.getElementById('expensePersonFilter');
      var personVal = personFilter ? personFilter.value : 'all';
      if (personVal !== 'all') {
        filtered = filtered.filter(function(e) {
          return (e.employeeName || '未知') === personVal;
        });
      }

      // 類別篩選
      var catFilter = document.getElementById('expenseCategoryFilter');
      var catVal = catFilter ? catFilter.value : 'all';
      if (catVal !== 'all') {
        filtered = filtered.filter(function(e) {
          return (e.category || '其他') === catVal;
        });
      }

      return filtered;
    }

    function renderSortedExpenses() {
      // V2.2: 先篩選再排序
      var sorted = getFilteredExpenses();
      sorted.sort(function(a, b) {
        var valA, valB;
        if (currentSortField === 'date') {
          valA = a.date || '';
          valB = b.date || '';
          return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        } else if (currentSortField === 'amount') {
          valA = Number(a.amountNTD) || 0;
          valB = Number(b.amountNTD) || 0;
          return currentSortDir === 'asc' ? valA - valB : valB - valA;
        } else {
          valA = a.employeeName || '';
          valB = b.employeeName || '';
          return currentSortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
      });
      renderExpenses(sorted);
    }

    function renderExpenses(expenses) {
      var container = document.getElementById('expenseListContainer');
      if (!expenses || expenses.length === 0) {
        container.innerHTML = '<div class="empty">沒有費用記錄</div>';
        return;
      }

      var canReview = isSubmitted();
      var html = '';
      for (var i = 0; i < expenses.length; i++) {
        var e = expenses[i];
        var hasPhoto = e.photoFileId || e.photoUrl;
        var eid = e.expenseId || '';  // 使用 expenseId 作為唯一識別符

        html += '<div class="expense-item">';
        html += '<div class="expense-header">';
        html += '<span class="expense-category">' + escHtml(e.category || '') + '</span>';
        html += '<span class="expense-amount">NT$ ' + (e.amountNTD || 0).toLocaleString() + '</span>';
        html += '</div>';
        html += '<div class="expense-desc">' + escHtml(e.description || '') + '</div>';
        html += '<div class="expense-submitter">' + escHtml(e.employeeName || '') + (e.belongTo && e.belongTo !== e.employeeName ? ' → ' + escHtml(e.belongTo) : '') + ' · ' + escHtml(e.date || '') + '</div>';
        html += '<div class="expense-header" style="margin-top:4px"><span class="badge badge-' + (e.expenseStatus || 'pending') + '">' + statusLabel(e.expenseStatus) + '</span>';
        if (e.expenseStatus === 'modified_pending' && e.previousStatus) {
          html += ' <span style="font-size:10px;color:#6b7280;">（原審核：<span class="badge badge-' + e.previousStatus + '" style="font-size:9px;">' + statusLabel(e.previousStatus) + '</span>）</span>';
        }
        html += '</div>';

        // BF-1: Photo — load via google.script.run (Drive URLs blocked in Sidebar iframe)
        if (hasPhoto) {
          var fileId = e.photoFileId || '';
          html += '<div id="photo-area-' + escAttr(eid) + '" style="margin-top:4px;">';
          html += '<a class="photo-link" onclick="loadPhoto(\'' + escAttr(eid) + '\',\'' + escAttr(fileId) + '\')">📷 查看單據</a>';
          html += '</div>';
        }

        // BF-2: Existing review note display
        if (e.expenseReviewNote) {
          html += '<div class="review-note-display">';
          if (e.expenseReviewDate) html += '<div class="note-date">審核日期：' + escHtml(e.expenseReviewDate) + '</div>';
          html += '💬 ' + escHtml(e.expenseReviewNote);
          html += '</div>';
        }

        // 審核操作區（僅已送審案件才顯示）
        if (canReview) {
          html += '<input class="note-input" id="note_' + escAttr(eid) + '" placeholder="審核備註..." value="' + escAttr(e.expenseReviewNote || '') + '">';
          html += '<div class="btn-group">';
          html += '<button class="btn btn-approve" onclick="reviewExpense(\'' + escAttr(eid) + '\',\'approved\')">通過</button>';
          html += '<button class="btn btn-revision" onclick="reviewExpense(\'' + escAttr(eid) + '\',\'needs_revision\')">補件</button>';
          html += '<button class="btn btn-reject" onclick="reviewExpense(\'' + escAttr(eid) + '\',\'rejected\')">退回</button>';
          html += '</div>';
        }

        html += '</div>';
      }
      container.innerHTML = html;
    }

    // === Actions ===
    function reviewExpense(expenseId, action) {
      if (!expenseId) return;
      var note = document.getElementById('note_' + expenseId).value || '';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            loadExpenses(currentTripCode);
          } else {
            alert('審核失敗: ' + result.error);
          }
        })
        .sidebarReviewExpense(currentTripCode, expenseId, action, note);
    }

    function showTripList() {
      document.getElementById('tripDetail').classList.remove('view-active');
      document.getElementById('tripList').classList.add('view-active');
      loadTrips();
    }

    // === Helpers ===
    function statusLabel(s) {
      var labels = { pending: '待審核', approved: '已通過', rejected: '已退回', needs_revision: '需補件', modified_pending: '已變更待重審' };
      return labels[s] || s || '待審核';
    }
    function tripStatusLabel(s) {
      var labels = { Open: '進行中', Submitted: '已送審', Closed: '已結案' };
      return labels[s] || s || '進行中';
    }
    function escHtml(s) {
      var d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }
    function escAttr(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
    }

    // BF-1: Load photo via server-side (bypass iframe CSP)
    function loadPhoto(expenseId, fileId) {
      if (!fileId) return;
      var area = document.getElementById('photo-area-' + expenseId);
      if (!area) return;
      area.innerHTML = '<span style="font-size:10px;color:#6b7280;">載入照片中...</span>';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success && result.photo) {
            area.innerHTML = '<div class="photo-container"><img src="' + result.photo + '" onclick="openLightbox(this.src)" style="width:100%;height:auto;max-height:200px;border-radius:6px;cursor:pointer;"></div>';
          } else {
            area.innerHTML = '<span style="font-size:10px;color:#ef4444;">照片載入失敗</span>';
          }
        })
        .withFailureHandler(function(err) {
          area.innerHTML = '<span style="font-size:10px;color:#ef4444;">照片載入失敗</span>';
        })
        .sidebarGetPhoto(fileId);
    }

    // === Enhanced Lightbox functions ===
    // V2.2: 全部照片瀏覽狀態
    var allPhotosMode = false;
    var allPhotosList = [];
    var currentPhotoIndex = 0;

    function openLightbox(url) {
      lbReset();
      allPhotosMode = false;  // 單張照片模式
      var lb = document.getElementById('sidebarLightbox');
      var img = document.getElementById('lightboxImg');
      img.src = url;
      lb.classList.add('active');
      updatePhotoNavButtons();
    }

    // V2.2: 顯示全部照片
    function toggleAllPhotos() {
      // 收集所有有照片的費用
      var photosWithExpense = [];
      for (var i = 0; i < currentExpenses.length; i++) {
        var e = currentExpenses[i];
        if (e.photoFileId || e.photoUrl) {
          photosWithExpense.push({
            expenseId: e.expenseId,
            fileId: e.photoFileId || '',
            url: e.photoUrl || '',
            description: e.description || '',
            amount: e.amountNTD || 0,
            category: e.category || '',
            employeeName: e.employeeName || ''
          });
        }
      }

      if (photosWithExpense.length === 0) {
        alert('目前沒有任何照片');
        return;
      }

      allPhotosList = photosWithExpense;
      currentPhotoIndex = 0;
      allPhotosMode = true;
      loadAllPhotosItem(0);
    }

    function loadAllPhotosItem(index) {
      if (index < 0 || index >= allPhotosList.length) return;
      currentPhotoIndex = index;
      var item = allPhotosList[index];

      // 顯示 lightbox
      lbReset();
      var lb = document.getElementById('sidebarLightbox');
      var img = document.getElementById('lightboxImg');
      lb.classList.add('active');
      updatePhotoNavButtons();

      // 設定載入中提示
      img.src = '';
      img.alt = '載入中...';

      if (item.url) {
        // 已有 URL，直接顯示
        img.src = item.url;
        img.alt = item.description;
        updateLightboxCaption(item);
      } else if (item.fileId) {
        // 需要從伺服器載入
        google.script.run
          .withSuccessHandler(function(result) {
            if (result.success && result.photo) {
              item.url = result.photo;  // 快取
              img.src = result.photo;
              img.alt = item.description;
              updateLightboxCaption(item);
            } else {
              img.alt = '照片載入失敗';
            }
          })
          .withFailureHandler(function(err) {
            img.alt = '照片載入失敗';
          })
          .sidebarGetPhoto(item.fileId);
      }
    }

    function updateLightboxCaption(item) {
      var hint = document.querySelector('.lightbox-hint');
      if (hint && allPhotosMode) {
        hint.textContent = (currentPhotoIndex + 1) + '/' + allPhotosList.length + ' · ' + item.description + ' · NT$ ' + item.amount.toLocaleString();
      } else if (hint) {
        hint.textContent = '滾輪縮放 · 拖曳平移 · 雙擊重置';
      }
    }

    function updatePhotoNavButtons() {
      // 此函數可以在需要時加入導航按鈕的顯示/隱藏邏輯
    }

    function nextPhoto() {
      if (!allPhotosMode || currentPhotoIndex >= allPhotosList.length - 1) return;
      loadAllPhotosItem(currentPhotoIndex + 1);
    }

    function prevPhoto() {
      if (!allPhotosMode || currentPhotoIndex <= 0) return;
      loadAllPhotosItem(currentPhotoIndex - 1);
    }

    function closeLightbox(e) {
      var lb = document.getElementById('sidebarLightbox');
      var target = e.target;
      if (target === lb || target.classList.contains('lightbox-close') || (target.parentElement && target.parentElement.classList.contains('lightbox-close'))) {
        lb.classList.remove('active');
        document.getElementById('lightboxImg').src = '';
        lbReset();
      }
    }

    function lbUpdateTransform() {
      var img = document.getElementById('lightboxImg');
      img.style.transform = 'translate(' + lbTranslateX + 'px,' + lbTranslateY + 'px) scale(' + lbScale + ') rotate(' + lbRotation + 'deg)';
    }

    function lbZoom(dir) {
      if (dir > 0) {
        lbScale = Math.min(lbScale * 1.3, 8);
      } else {
        lbScale = Math.max(lbScale / 1.3, 0.2);
      }
      lbUpdateTransform();
    }

    function lbRotate() {
      lbRotation = (lbRotation + 90) % 360;
      lbUpdateTransform();
    }

    function lbReset() {
      lbScale = 1;
      lbRotation = 0;
      lbTranslateX = 0;
      lbTranslateY = 0;
      var img = document.getElementById('lightboxImg');
      if (img) img.style.transform = '';
    }

    // Wheel zoom
    (function() {
      var lb = document.getElementById('sidebarLightbox');
      lb.addEventListener('wheel', function(e) {
        if (!lb.classList.contains('active')) return;
        e.preventDefault();
        lbZoom(e.deltaY < 0 ? 1 : -1);
      }, { passive: false });

      // Mouse drag
      var img = document.getElementById('lightboxImg');
      img.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        e.preventDefault();
        lbDragging = true;
        lbStartX = e.clientX - lbTranslateX;
        lbStartY = e.clientY - lbTranslateY;
      });
      document.addEventListener('mousemove', function(e) {
        if (!lbDragging) return;
        lbTranslateX = e.clientX - lbStartX;
        lbTranslateY = e.clientY - lbStartY;
        lbUpdateTransform();
      });
      document.addEventListener('mouseup', function() {
        lbDragging = false;
      });

      // Double click to reset
      img.addEventListener('dblclick', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (lbScale !== 1 || lbRotation !== 0) {
          lbReset();
          lbUpdateTransform();
        } else {
          lbScale = 2.5;
          lbUpdateTransform();
        }
      });

      // Touch: pinch zoom and pan
      var lastTouchDist = 0;
      var lastTouchX = 0;
      var lastTouchY = 0;
      img.addEventListener('touchstart', function(e) {
        if (e.touches.length === 2) {
          lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        } else if (e.touches.length === 1) {
          lastTouchX = e.touches[0].clientX - lbTranslateX;
          lastTouchY = e.touches[0].clientY - lbTranslateY;
        }
      }, { passive: true });
      img.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (e.touches.length === 2) {
          var dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
          if (lastTouchDist > 0) {
            lbScale = Math.max(0.2, Math.min(8, lbScale * (dist / lastTouchDist)));
            lbUpdateTransform();
          }
          lastTouchDist = dist;
        } else if (e.touches.length === 1 && lbScale > 1) {
          lbTranslateX = e.touches[0].clientX - lastTouchX;
          lbTranslateY = e.touches[0].clientY - lastTouchY;
          lbUpdateTransform();
        }
      }, { passive: false });
      img.addEventListener('touchend', function() { lastTouchDist = 0; }, { passive: true });
    })();

    init();
  </script>
</body>
