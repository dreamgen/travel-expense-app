<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅費記帳助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f3f4f6;
            /* Gray-100 */
        }

        /* 自定義滾動條隱藏但保持功能 (Horizontal Scroll) */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 類別選擇的動畫 */
        .category-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 4.5rem;
            /* 確保按鈕不會太窄 */
        }

        .category-btn.active {
            background-color: #3b82f6;
            /* Blue-500 */
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
            border-color: transparent;
        }

        /* 輸入框聚焦樣式 */
        .input-focus-ring:focus-within {
            ring: 2px;
            ring-color: #3b82f6;
        }

        /* Loading Spinner */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            /* Safari */
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Modal Transition */
        .modal-enter {
            opacity: 0;
        }

        .modal-enter-active {
            opacity: 1;
            transition: opacity 300ms ease-out;
        }

        .modal-content-enter {
            transform: translateY(100%);
        }

        .modal-content-enter-active {
            transform: translateY(0);
            transition: transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen pb-24">

    <!-- 頂部導航 -->
    <nav class="bg-white shadow-sm sticky top-0 z-40 safe-top">
        <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="text-lg font-bold text-gray-800">新增支出</h1>
            <div class="flex items-center gap-2">
                <button id="settings-btn"
                    class="text-gray-400 hover:text-gray-600 p-2 rounded-full active:bg-gray-100 transition-colors">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
                <button id="close-modal-btn"
                    class="text-gray-400 hover:text-gray-600 p-2 rounded-full active:bg-gray-100 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- 1. 金額輸入區 (核心焦點 + 快速相機) -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 relative overflow-hidden">
            <!-- 匯率提示標籤 (當非 TWD 時顯示) -->
            <div id="rate-badge"
                class="hidden absolute top-0 right-0 bg-yellow-100 text-yellow-800 text-[10px] px-2 py-1 rounded-bl-lg font-medium">
                匯率: <span id="rate-badge-val">0.23</span>
            </div>

            <label class="block text-gray-500 text-sm font-medium mb-1 text-center">
                消費金額 (<span id="currency-label">TWD</span>)
            </label>
            <div class="flex items-center justify-center gap-3">
                <!-- 金額輸入框 -->
                <div class="relative flex-1 max-w-[200px]">
                    <span id="currency-symbol"
                        class="text-2xl text-gray-400 absolute left-2 top-1/2 transform -translate-y-1/2 font-light">$</span>
                    <input type="number" id="amount" inputmode="decimal" placeholder="0"
                        class="w-full text-center text-4xl font-bold text-gray-800 placeholder-gray-200 outline-none bg-transparent h-14 pl-6"
                        autofocus>
                </div>

                <!-- 快速相機按鈕 -->
                <button type="button" id="quick-camera-btn"
                    class="w-12 h-12 rounded-xl bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 flex items-center justify-center transition-all active:scale-95 shadow-inner border border-transparent">
                    <i class="fa-solid fa-camera text-xl"></i>
                </button>
            </div>
            <div id="amount-error" class="hidden text-red-500 text-sm mt-2 text-center">請輸入有效金額</div>
        </div>

        <!-- 3. 類別選擇 (優化：單行橫向捲動) -->
        <div class="space-y-2">
            <div class="flex overflow-x-auto hide-scrollbar gap-2 pb-2 px-1" id="category-grid">
                <!-- 縮小尺寸，單行排列 -->
                <button type="button"
                    class="category-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 flex-shrink-0"
                    data-value="food">
                    <i class="fa-solid fa-utensils text-lg mb-1"></i>
                    <span class="text-[10px] font-medium">餐飲</span>
                </button>
                <button type="button"
                    class="category-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 flex-shrink-0"
                    data-value="transport">
                    <i class="fa-solid fa-train-subway text-lg mb-1"></i>
                    <span class="text-[10px] font-medium">交通</span>
                </button>
                <button type="button"
                    class="category-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 flex-shrink-0"
                    data-value="hotel">
                    <i class="fa-solid fa-bed text-lg mb-1"></i>
                    <span class="text-[10px] font-medium">住宿</span>
                </button>
                <button type="button"
                    class="category-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 flex-shrink-0"
                    data-value="ticket">
                    <i class="fa-solid fa-ticket text-lg mb-1"></i>
                    <span class="text-[10px] font-medium">票券</span>
                </button>
                <button type="button"
                    class="category-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 flex-shrink-0"
                    data-value="shopping">
                    <i class="fa-solid fa-bag-shopping text-lg mb-1"></i>
                    <span class="text-[10px] font-medium">購物</span>
                </button>
                <button type="button"
                    class="category-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg bg-white border border-gray-200 text-gray-500 hover:bg-gray-50 flex-shrink-0"
                    data-value="other">
                    <i class="fa-solid fa-ellipsis text-lg mb-1"></i>
                    <span class="text-[10px] font-medium">其他</span>
                </button>
            </div>
            <input type="hidden" id="category" value="">
        </div>

        <!-- 詳細資訊表單 -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

            <!-- 品項說明 -->
            <div class="p-4 border-b border-gray-100 flex items-center">
                <i class="fa-solid fa-pen text-gray-400 w-8 text-center"></i>
                <input type="text" id="description" placeholder="輸入項目說明"
                    class="flex-1 ml-2 outline-none text-gray-700 placeholder-gray-400 bg-transparent text-sm">
            </div>

            <!-- 日期選擇 -->
            <div class="p-4 border-b border-gray-100 flex items-center">
                <i class="fa-regular fa-calendar text-gray-400 w-8 text-center"></i>
                <input type="date" id="date"
                    class="flex-1 ml-2 outline-none text-gray-700 bg-transparent font-medium text-sm">
            </div>

            <!-- 2. 付款人 (優化：預設本人，可展開) -->
            <div class="p-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <i class="fa-solid fa-wallet text-gray-400 w-8 text-center"></i>
                        <span class="ml-2 text-gray-700 font-medium text-sm">付款人</span>
                    </div>
                </div>

                <!-- 預設顯示區 (簡潔模式) -->
                <div id="payer-default-view" class="mt-2 pl-10 flex items-center justify-between">
                    <div
                        class="flex items-center gap-2 bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full border border-blue-100">
                        <i class="fa-solid fa-user text-xs"></i>
                        <span class="text-sm font-medium" id="current-payer-name">我 (Alice)</span>
                    </div>
                    <button type="button" id="change-payer-btn"
                        class="text-xs text-gray-400 underline hover:text-gray-600">
                        非本人?
                    </button>
                </div>

                <!-- 完整選擇區 (隱藏模式) -->
                <div id="payer-select-view" class="hidden mt-3 pl-10">
                    <div class="flex gap-2 overflow-x-auto hide-scrollbar">
                        <label class="cursor-pointer flex-shrink-0">
                            <input type="radio" name="payer" value="Alice" class="peer sr-only" checked>
                            <div
                                class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 peer-checked:bg-blue-600 peer-checked:text-white transition-colors text-xs font-medium border border-transparent peer-checked:border-blue-600">
                                Alice (我)
                            </div>
                        </label>
                        <label class="cursor-pointer flex-shrink-0">
                            <input type="radio" name="payer" value="Bob" class="peer sr-only">
                            <div
                                class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 peer-checked:bg-blue-600 peer-checked:text-white transition-colors text-xs font-medium border border-transparent peer-checked:border-blue-600">
                                Bob
                            </div>
                        </label>
                        <label class="cursor-pointer flex-shrink-0">
                            <input type="radio" name="payer" value="Charlie" class="peer sr-only">
                            <div
                                class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 peer-checked:bg-blue-600 peer-checked:text-white transition-colors text-xs font-medium border border-transparent peer-checked:border-blue-600">
                                Charlie
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- 圖片上傳區 (可與上方快速按鈕連動) -->
        <div class="border-2 border-dashed border-gray-300 rounded-2xl p-4 text-center hover:bg-gray-50 transition-colors cursor-pointer relative"
            id="upload-area">
            <input type="file" id="receipt-upload" accept="image/*"
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
            <div class="flex flex-col items-center justify-center text-gray-400" id="upload-placeholder">
                <i class="fa-solid fa-camera text-xl mb-1"></i>
                <span class="text-xs">點此 (或上方按鈕) 補拍收據</span>
            </div>
            <!-- 預覽區 -->
            <div id="image-preview" class="hidden relative z-20">
                <img src="" alt="Receipt Preview" class="max-h-48 mx-auto rounded-lg shadow-sm object-contain">
                <button type="button" id="remove-image"
                    class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-times text-xs"></i>
                </button>
            </div>
        </div>

    </main>

    <!-- 底部懸浮按鈕區 -->
    <div
        class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent pt-8 safe-bottom z-40 max-w-md mx-auto">
        <button id="submit-btn"
            class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2">
            <span id="btn-text">確認儲存</span>
            <div id="btn-loader" class="loader hidden"></div>
        </button>
    </div>

    <!-- 設定 Modal (隱藏) -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog"
        aria-modal="true">
        <!-- 背景遮罩 -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity opacity-0" id="modal-backdrop">
        </div>

        <!-- Modal 內容 -->
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl p-6 transform translate-y-full transition-transform duration-300 ease-out max-w-md mx-auto h-auto shadow-2xl"
            id="modal-panel">

            <!-- 標題與關閉按鈕 -->
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-800 tracking-wide">設定</h2>
                <button id="close-settings-btn"
                    class="p-2 -mr-2 text-gray-400 hover:text-gray-600 rounded-full hover:bg-gray-100 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- 幣別選擇 -->
            <div class="mb-6">
                <label class="block text-gray-500 text-sm font-medium mb-3">選擇記帳幣別</label>
                <div class="grid grid-cols-3 gap-3">
                    <button type="button"
                        class="currency-opt-btn active ring-2 ring-blue-500 bg-blue-50 text-blue-700 border-transparent py-2.5 rounded-xl border border-gray-200 text-sm font-medium transition-all shadow-sm"
                        data-currency="TWD" data-symbol="$">TWD</button>
                    <button type="button"
                        class="currency-opt-btn py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-all"
                        data-currency="JPY" data-symbol="¥">JPY</button>
                    <button type="button"
                        class="currency-opt-btn py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-all"
                        data-currency="USD" data-symbol="$">USD</button>
                    <button type="button"
                        class="currency-opt-btn py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-all"
                        data-currency="KRW" data-symbol="₩">KRW</button>
                    <button type="button"
                        class="currency-opt-btn py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-all"
                        data-currency="EUR" data-symbol="€">EUR</button>
                    <button type="button"
                        class="currency-opt-btn py-2.5 rounded-xl border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-all"
                        data-currency="CNY" data-symbol="¥">CNY</button>
                </div>
            </div>

            <!-- 匯率輸入 -->
            <div class="mb-8">
                <label class="block text-gray-500 text-sm font-medium mb-2">匯率設定</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="text-gray-400 text-sm font-medium">1 <span id="target-curr-span">TWD</span> =
                        </span>
                    </div>
                    <input type="number" id="exchange-rate" step="0.0001" value="1.0"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-24 pr-12 py-3.5 text-lg font-medium text-gray-800 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all group-hover:bg-white"
                        readonly>
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                        <span class="text-gray-400 text-sm font-medium">TWD</span>
                    </div>
                </div>
                <p class="text-xs text-gray-400 mt-2 ml-1" id="rate-hint">預設為台幣，匯率固定為 1.0</p>
            </div>

            <!-- 儲存按鈕 -->
            <button id="save-settings-btn"
                class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-4 rounded-xl active:scale-95 transition-transform shadow-lg shadow-gray-200">
                儲存設定
            </button>
            <div class="h-6"></div> <!-- Safe area spacing -->
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast"
        class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none z-[60] flex items-center gap-2">
        <i class="fa-solid fa-check-circle text-green-400"></i>
        <span id="toast-message">儲存成功！</span>
    </div>

    <!-- JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // 全域變數狀態
            let currentCurrency = 'TWD';
            let currentSymbol = '$';
            let currentRate = 1.0;

            // --- 1. 基本初始化 ---
            const dateInput = document.getElementById('date');
            dateInput.valueAsDate = new Date();

            // --- 2. 類別選擇邏輯 ---
            const categoryBtns = document.querySelectorAll('.category-btn');
            const categoryInput = document.getElementById('category');

            categoryBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryBtns.forEach(b => b.classList.remove('active', 'border-blue-500', 'text-blue-600'));
                    btn.classList.add('active');
                    categoryInput.value = btn.dataset.value;
                });
            });
            if (categoryBtns.length > 0) categoryBtns[0].click();

            // --- 3. 圖片上傳邏輯 ---
            const uploadInput = document.getElementById('receipt-upload');
            const previewContainer = document.getElementById('image-preview');
            const previewImg = previewContainer.querySelector('img');
            const placeholder = document.getElementById('upload-placeholder');
            const removeBtn = document.getElementById('remove-image');
            const quickCameraBtn = document.getElementById('quick-camera-btn');

            quickCameraBtn.addEventListener('click', () => {
                uploadInput.click();
            });

            function updateImageState(hasImage) {
                if (hasImage) {
                    previewContainer.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    quickCameraBtn.classList.remove('bg-gray-100', 'text-gray-400');
                    quickCameraBtn.classList.add('bg-green-100', 'text-green-600', 'border-green-200');
                    quickCameraBtn.innerHTML = '<i class="fa-solid fa-check text-xl"></i>';
                } else {
                    uploadInput.value = '';
                    previewContainer.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    quickCameraBtn.classList.add('bg-gray-100', 'text-gray-400');
                    quickCameraBtn.classList.remove('bg-green-100', 'text-green-600', 'border-green-200');
                    quickCameraBtn.innerHTML = '<i class="fa-solid fa-camera text-xl"></i>';
                }
            }

            uploadInput.addEventListener('change', function (e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        previewImg.src = e.target.result;
                        updateImageState(true);
                    }
                    reader.readAsDataURL(file);
                }
            });

            removeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                updateImageState(false);
            });

            // --- 4. 付款人選擇邏輯 ---
            const defaultView = document.getElementById('payer-default-view');
            const selectView = document.getElementById('payer-select-view');
            const changePayerBtn = document.getElementById('change-payer-btn');
            const currentPayerLabel = document.getElementById('current-payer-name');
            const payerRadios = document.querySelectorAll('input[name="payer"]');

            changePayerBtn.addEventListener('click', () => {
                defaultView.classList.add('hidden');
                selectView.classList.remove('hidden');
            });

            payerRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const selectedLabel = e.target.parentElement.querySelector('div').textContent.trim();
                    currentPayerLabel.textContent = selectedLabel.replace(' (我)', '');
                });
            });

            // --- 5. 設定 Modal 邏輯 (新增部分) ---
            const settingsBtn = document.getElementById('settings-btn');
            const settingsModal = document.getElementById('settings-modal');
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalPanel = document.getElementById('modal-panel');
            const closeSettingsBtn = document.getElementById('close-settings-btn');
            const saveSettingsBtn = document.getElementById('save-settings-btn');

            // 設定內的元素
            const currencyOptBtns = document.querySelectorAll('.currency-opt-btn');
            const exchangeRateInput = document.getElementById('exchange-rate');
            const targetCurrSpan = document.getElementById('target-curr-span');
            const rateHint = document.getElementById('rate-hint');

            // 臨時狀態 (在 Modal 未儲存前)
            let tempCurrency = 'TWD';
            let tempSymbol = '$';

            // 開啟 Modal
            settingsBtn.addEventListener('click', () => {
                settingsModal.classList.remove('hidden');
                // Animation frame hack to trigger transition
                requestAnimationFrame(() => {
                    modalBackdrop.classList.remove('opacity-0');
                    modalPanel.classList.remove('translate-y-full');
                });

                // 重置 UI 為當前狀態
                updateSettingsUI(currentCurrency, currentRate);
            });

            // 關閉 Modal function
            function closeSettings() {
                modalBackdrop.classList.add('opacity-0');
                modalPanel.classList.add('translate-y-full');
                setTimeout(() => {
                    settingsModal.classList.add('hidden');
                }, 300); // Wait for transition duration
            }

            closeSettingsBtn.addEventListener('click', closeSettings);
            modalBackdrop.addEventListener('click', closeSettings);

            // 幣別按鈕點擊
            currencyOptBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // UI 更新
                    currencyOptBtns.forEach(b => {
                        b.classList.remove('active', 'ring-2', 'ring-blue-500', 'bg-blue-50', 'text-blue-700', 'border-transparent');
                        b.classList.add('border-gray-200', 'text-gray-600');
                    });
                    btn.classList.add('active', 'ring-2', 'ring-blue-500', 'bg-blue-50', 'text-blue-700', 'border-transparent');
                    btn.classList.remove('border-gray-200', 'text-gray-600');

                    tempCurrency = btn.dataset.currency;
                    tempSymbol = btn.dataset.symbol;
                    targetCurrSpan.textContent = tempCurrency;

                    // 匯率邏輯
                    if (tempCurrency === 'TWD') {
                        exchangeRateInput.value = '1.0';
                        exchangeRateInput.readOnly = true;
                        exchangeRateInput.classList.add('bg-gray-50');
                        exchangeRateInput.classList.remove('bg-white');
                        rateHint.textContent = '預設為台幣，匯率固定為 1.0';
                    } else {
                        exchangeRateInput.readOnly = false;
                        exchangeRateInput.classList.remove('bg-gray-50');
                        exchangeRateInput.classList.add('bg-white');
                        // 這裡可以加上簡單的預設匯率邏輯 (若有需要)
                        if (exchangeRateInput.value === '1.0' || exchangeRateInput.value === '1') {
                            exchangeRateInput.value = ''; // 清空讓使用者輸入
                            exchangeRateInput.focus();
                        }
                        rateHint.textContent = `請輸入 1 ${tempCurrency} 等於多少台幣`;
                    }
                });
            });

            // 更新 Modal 內部 UI 狀態
            function updateSettingsUI(curr, rate) {
                tempCurrency = curr;
                currencyOptBtns.forEach(btn => {
                    if (btn.dataset.currency === curr) {
                        btn.click(); // 觸發點擊事件來設定樣式和狀態
                    }
                });
                exchangeRateInput.value = rate;
            }

            // 儲存設定
            saveSettingsBtn.addEventListener('click', () => {
                const newRate = parseFloat(exchangeRateInput.value);
                if (isNaN(newRate) || newRate <= 0) {
                    alert('請輸入有效的匯率');
                    return;
                }

                // 更新全域狀態
                currentCurrency = tempCurrency;
                currentSymbol = tempSymbol;
                currentRate = newRate;

                // 更新主畫面顯示
                document.getElementById('currency-label').textContent = currentCurrency;
                document.getElementById('currency-symbol').textContent = currentSymbol;

                // 更新匯率提示 Badge
                const rateBadge = document.getElementById('rate-badge');
                if (currentCurrency !== 'TWD') {
                    rateBadge.classList.remove('hidden');
                    document.getElementById('rate-badge-val').textContent = currentRate;
                } else {
                    rateBadge.classList.add('hidden');
                }

                showToast('設定已更新');
                closeSettings();
            });


            // --- 6. 表單提交 ---
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const amountInput = document.getElementById('amount');
            const descInput = document.getElementById('description');
            const amountError = document.getElementById('amount-error');

            submitBtn.addEventListener('click', async () => {
                const amount = parseFloat(amountInput.value);
                if (!amount || amount <= 0) {
                    amountError.classList.remove('hidden');
                    return;
                }
                amountError.classList.add('hidden');

                const payer = document.querySelector('input[name="payer"]:checked')?.value;

                const formData = {
                    date: dateInput.value,
                    amount: amount,
                    currency: currentCurrency, // 新增
                    exchangeRate: currentRate, // 新增
                    category: categoryInput.value,
                    description: descInput.value,
                    payer: payer,
                    hasReceipt: !!uploadInput.files[0]
                };

                console.log('Submit:', formData);

                // Loading UI
                btnText.textContent = '儲存中...';
                btnLoader.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-75');

                try {
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    // await google.script.run...
                    showToast('支出已成功儲存！');
                    resetForm();
                } catch (error) {
                    showToast('儲存失敗', true);
                } finally {
                    btnText.textContent = '確認儲存';
                    btnLoader.classList.add('hidden');
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75');
                }
            });

            function resetForm() {
                amountInput.value = '';
                descInput.value = '';
                dateInput.valueAsDate = new Date();
                updateImageState(false);
                if (categoryBtns.length > 0) categoryBtns[0].click();

                document.querySelector('input[name="payer"][value="Alice"]').checked = true;
                currentPayerLabel.textContent = "我 (Alice)";
                defaultView.classList.remove('hidden');
                selectView.classList.add('hidden');

                // 不重置幣別設定，因為通常同一旅程會用相同幣別
                amountInput.focus();
            }

            function showToast(message, isError = false) {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toast-message');
                const icon = toast.querySelector('i');
                toastMsg.textContent = message;
                icon.className = isError ? 'fa-solid fa-circle-exclamation text-red-400' : 'fa-solid fa-check-circle text-green-400';
                toast.classList.remove('opacity-0', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-4');
                }, 3000);
            }
        });
    </script>
</body>

</html>
